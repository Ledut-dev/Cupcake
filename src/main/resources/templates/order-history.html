<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/admin-style.css"/>
    <title>Ordrehistorik</title>
    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/menu-style.css">
</head>
<body>
<div id="header">
    <!--lav grid-->
    <!--butik navn+slogan-->
    <!--basket knap-->
    <!--kundenavn-->
    <div id="header-grid">

        <div class="headerItem" style="grid-area: header-area-1"></div>
        <div class="headerItem" style="grid-area: logo-area">
            <img id="logomark" src="svg/Copenhagen Cupcakes_title.svg" alt="Copenhagen Cupcakes">
        </div>

        <div id="back-to-front" class="headerItem" style="grid-area: header-area-4">
            <a href="/">Tilbage til forsiden</a>
        </div>


        <div id="greeting" class="headerItem" style="grid-area: user-greeting" th:if="${session.currentUser != null}">
            <p th:text="${'Velkommen ' + session.currentUser.name}">Hej, fornavn</p>
        </div>

        <div id="logout" class="headerItem" style="grid-area: header-area-6" th:if="${session.currentUser != null}">
            <a href="/logout">Log ud</a>
        </div>

        <div id="login" class="headerItem" style="grid-area: header-area-6" th:if="${session.currentUser == null}">
            <form method="GET" action="/login">
                <button class="button" type="submit">Login</button>
            </form>
        </div>

        <div class="headerItem" style="grid-area: header-area-4"></div>
        <div class="headerItem" style="grid-area: slogan-area">
            <img id="slogan" src="svg/Artisan Cupcakes.svg" alt="Artisan Cupcakes">
        </div>
        <div class="headerItem" style="grid-area: header-area-6">
            <a id="cart-anchor" href="cart">
                <img src="svg/cart.svg" alt="cart">
                Min kurv
            </a>
        </div>

    </div>
</div>

<table class="expandable-table" id="orderHistoryTable">
    <thead>
    <tr>
        <th scope="col" style="width: 5%;"> <form action="/admin"><input type="submit" value="Tilbage"></form> </th>
        <th scope="col">Ordre ID</th>
        <th scope="col">Email</th>
        <th scope="col">Totalpris</th>
        <th scope="col">Bestillingsdato</th>
        <th scope="col">Ordrestatus</th>
    </tr>
    </thead>
    <tbody>
    <div th:each="order : ${orders}">
        <tr class="row-expandable">
            <td><span class="expand-icon">+</span></td>
            <td><span th:if="${order.id != null}" th:text="${order.id}">Ordre ID</span></td>
            <td><span th:if="${order.customer.email != null}" th:text="${order.customer.email}">Email</span></td>
            <td><span th:if="${order.getTotal() != null}" th:text="${order.getTotal()}">Totalpris</span></td>
            <td><span th:if="${order.orderDate != null}" th:text="${order.orderDate}">Bestillingsdato</span></td>
            <td><span th:if="${order.orderDate != null}" th:text="${order.status}">Ordrestatus</span></td>
        </tr>
        <tr class="row-details">
            <td colspan="6">
                <div>
                    <strong>Ordredetaljer:</strong>
                    <ul>
                        <!-- orderline.cupcakeBottom and top's getters return the flavor directly -->
                        <li th:each="orderline : ${order.orderlines}"
                            th:text="${orderline.cupcakeBottom.flavor != null && orderline.cupcakeTop.flavor != null &&
                            orderline.quantity != null && orderline.getTotalPrice() != null} ?
                            ${orderline.cupcakeBottom.flavor} + ' + ' + ${orderline.cupcakeTop.flavor} + ' (' +
                            ${orderline.quantity} + ') - ' + ${orderline.getTotalPrice()} + 'kr'">
                            Bundsmag + toppingsmag (antal) - pris
                        </li>
                    </ul>
                </div>
            </td>
        </tr>
    </div>
    </tbody>
</table>

<div id="footer">
    <p class="footerItem" style="grid-area: footer-1">Om os</p>
    <p class="footerItem" style="grid-area: footer-2">Kontakt</p>
    <p class="footerItem" style="grid-area: footer-3">Karriere</p>
    <p class="footerItem" style="grid-area: footer-4">Økologi</p>
    <p class="footerItem" style="grid-area: footer-5">CSR</p>
    <p class="footerItem" style="grid-area: footer-6">Kage til din fest?</p>
</div>

<script src="js/expandable-table.js" defer></script>
</body>
</html>
