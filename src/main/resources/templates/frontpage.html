<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Copenhagen Cupcakes</title>
</head>
<body>

<div th:if="${session.currentUser == null}">
<form method="GET" action="/login">
    <button class="button" type="submit">Login</button>
</form>
</div>

<div th:if="${session.currentUser != null}">
    <p th:text="${'Welcome ' + session.currentUser.name}">Welcome message</p>

    <a href="/logout">Log ud</a>

</div>

<a href="/menu">Gå til menu</a>

<a href="/cart">Se din kurv</a>

</body>
</html>
