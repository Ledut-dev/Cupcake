<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ordrebekræftelse</title>
    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/menu-style.css">
</head>
<body>
<div id="header">
    <!--lav grid-->
    <!--butik navn+slogan-->
    <!--basket knap-->
    <!--kundenavn-->
    <div id="header-grid">

        <div class="headerItem" style="grid-area: header-area-1"></div>
        <div class="headerItem" style="grid-area: logo-area">
            <img id="logomark" src="svg/Copenhagen Cupcakes_title.svg" alt="Copenhagen Cupcakes">
        </div>

        <div id="back-to-front" class="headerItem" style="grid-area: header-area-4">
            <a href="/">Tilbage til forsiden</a>
        </div>

        <div id="greeting" class="headerItem" style="grid-area: user-greeting" th:if="${session.currentUser != null}">
            <p th:text="${'Velkommen ' + session.currentUser.name}">Hej, fornavn</p>
        </div>

        <div id="logout" class="headerItem" style="grid-area: login-area" th:if="${session.currentUser != null}">
            <a href="/logout">Log ud</a>
        </div>

        <div id="login" class="headerItem" style="grid-area: login-area" th:if="${session.currentUser == null}">
            <form method="GET" action="/login">
                <button class="button" type="submit">Login</button>
            </form>
        </div>

        <div class="headerItem" style="grid-area: slogan-area">
            <img id="slogan" src="svg/Artisan Cupcakes.svg" alt="Artisan Cupcakes">
        </div>
        <div class="headerItem" style="grid-area: cart-area">
            <a id="cart-anchor" href="cart">
                <img src="svg/cart.svg" alt="cart">
                Min kurv
            </a>
        </div>

    </div>
</div>

<h1>Success!!</h1>

<div id="footer">
    <p class="footerItem" style="grid-area: footer-1">Om os</p>
    <p class="footerItem" style="grid-area: footer-2">Kontakt</p>
    <p class="footerItem" style="grid-area: footer-3">Karriere</p>
    <p class="footerItem" style="grid-area: footer-4">Økologi</p>
    <p class="footerItem" style="grid-area: footer-5">CSR</p>
    <p class="footerItem" style="grid-area: footer-6">Kage til din fest?</p>
</div>

</body>
</html>
