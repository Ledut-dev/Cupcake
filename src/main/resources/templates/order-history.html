<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/admin-style.css"/>
    <title>Ordrehistorik</title>
</head>
<body>
<table class="expandable-table" id="orderHistoryTable">
    <thead>
    <tr>
        <th scope="col" style="width: 5%;"></th>
        <th scope="col">Ordre ID</th>
        <th scope="col">Email</th>
        <th scope="col">Totalpris</th>
        <th scope="col">Bestillingsdato</th>
        <th scope="col">Afhentningsdato</th>
    </tr>
    </thead>
    <tbody>
    <div th:each="order : ${orders}">
        <tr class="row-expandable">
            <td><span class="expand-icon">+</span></td>
            <td><span th:unless="${#strings.isEmpty(order.id)}" th:text="${order.id}">Ordre ID</span></td>
            <td><span th:unless="${#strings.isEmpty(order.customer.email)}" th:text="${order.customer.email}">Email</span></td>
            <td><span th:unless="${#strings.isEmpty(order.getTotal())}" th:text="${order.getTotal()}">Totalpris</span></td>
            <td><span th:unless="${#strings.isEmpty(order.orderDate)}" th:text="${order.orderDate}">Bestillingsdato</span></td>
            <td><span th:unless="${#strings.isEmpty(order.pickupDate)}" th:text="${order.pickupDate}">Afhentningsdato</span></td>
        </tr>
        <tr class="row-details">
            <td colspan="6">
                <div>
                    <strong>Ordredetaljer:</strong>
                    <ul>
                        <li th:each="orderline : ${order.orderlines}"
                            th:text="${orderline.cupcakeBottom != null} ?   ${orderline.cupcakeBottom.flavor} + ' + ' + ${orderline.cupcakeTop.flavor} +
                                     ' (' + ${orderline.quantity} + ') - ' + ${orderline.getTotalPrice()} + 'kr'">
                            Bundsmag + toppingsmag (antal) - pris
                        </li>
                    </ul>
                </div>
            </td>
        </tr>
    </div>
    </tbody>
</table>

<script src="js/admin.js" defer></script>
</body>
</html>
